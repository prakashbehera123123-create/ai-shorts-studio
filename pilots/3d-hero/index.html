<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <style>
      /* AI Shorts Studio palette (docs/CREATIVE_PRODUCTION_STANDARD.md §4) */
      :root {
        --base-a: #0b1020;
        --base-b: #121a33;
        --ink: #ffffff;
        --muted: #aab4cf;
        --cyan: #4cc9f0;
        --amber: #ffb703;
        --mint: #3ddc97;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--base-a); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display);
              background: linear-gradient(180deg, var(--base-a), var(--base-b)); }
      #sat-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #sat-kicker { position: absolute; left: 110px; top: 300px; font-size: 34px; font-weight: 700; color: var(--muted);
                    letter-spacing: 0.08em; }
      #sat-title { position: absolute; left: 110px; right: 110px; top: 352px; font-size: 84px; font-weight: 900;
                   line-height: 1.05; color: var(--ink); }
      #sat-title span { color: var(--cyan); display: inline-block; }
      #sat-badge { position: absolute; left: 330px; top: 294px; font-size: 30px; font-weight: 700; color: var(--amber);
                   border: 3px solid var(--amber); border-radius: 999px; padding: 6px 18px; }
      #sat-lines { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .sat-label { position: absolute; left: 0; top: 0; font-size: 40px; font-weight: 700; color: var(--ink);
                   background: rgba(18, 26, 51, 0.88); border: 3px solid var(--cyan); border-radius: 18px;
                   padding: 10px 22px; white-space: nowrap; }
      #sat-source { position: absolute; left: 110px; top: 560px; font-size: 28px; color: var(--muted);
                    background: rgba(11, 16, 32, 0.85); border-radius: 12px; padding: 6px 14px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <canvas id="sat-canvas" width="1080" height="1920"></canvas>
      <svg id="sat-lines" viewBox="0 0 1080 1920">
        <line id="sat-line-0" stroke="#4cc9f0" stroke-width="4" opacity="0" />
        <line id="sat-line-1" stroke="#4cc9f0" stroke-width="4" opacity="0" />
        <line id="sat-line-2" stroke="#4cc9f0" stroke-width="4" opacity="0" />
        <circle id="sat-dot-0" r="10" fill="#4cc9f0" opacity="0" />
        <circle id="sat-dot-1" r="10" fill="#4cc9f0" opacity="0" />
        <circle id="sat-dot-2" r="10" fill="#4cc9f0" opacity="0" />
      </svg>
      <div id="sat-label-0" class="sat-label" style="opacity:0">Solar arrays</div>
      <div id="sat-label-1" class="sat-label" style="opacity:0">Antenna dish</div>
      <div id="sat-label-2" class="sat-label" style="opacity:0">Radiator</div>
      <div id="sat-kicker" class="clip" data-start="0" data-duration="7" data-track-index="1">3D PILOT</div>
      <div id="sat-badge" class="clip" data-start="0" data-duration="7" data-track-index="1">ILLUSTRATIVE</div>
      <h1 id="sat-title" class="clip" data-start="0" data-duration="7" data-track-index="1">A satellite, <span>built in code</span></h1>
      <div id="sat-source" class="clip" data-start="0" data-duration="7" data-track-index="1">Procedural low-poly model · no third-party assets</div>
      <div id="sat-drv" class="clip" data-start="0" data-duration="7" data-track-index="0"
           style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rng = mulberry32(7);
        var W = 1080, H = 1920;

        var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("sat-canvas"), antialias: true, alpha: true });
        renderer.setSize(W, H, false);
        renderer.setPixelRatio(1);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        renderer.setClearColor(0x000000, 0);

        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);

        // Light: warm key, cool rim, low ambient (hyperframes 3d.md)
        var key = new THREE.DirectionalLight(0xffe2b8, 2.2); key.position.set(6, 5, 8); scene.add(key);
        var rim = new THREE.DirectionalLight(0x9fdcff, 0.9); rim.position.set(-8, 2, -6); scene.add(rim);
        scene.add(new THREE.AmbientLight(0x22305a, 0.9));

        // Stars (seeded)
        var starGeo = new THREE.BufferGeometry(); var pos = [];
        for (var i = 0; i < 700; i++) {
          var r = 60 + rng() * 40, th = rng() * Math.PI * 2, ph = Math.acos(2 * rng() - 1);
          pos.push(r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph));
        }
        starGeo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xaab4cf, size: 0.25, sizeAttenuation: true })));

        // Low-poly planet: flat-shaded icosphere, ocean/land by seeded height
        var planetGeo = new THREE.IcosahedronGeometry(4, 4);
        var p = planetGeo.attributes.position, colors = [];
        var ocean = new THREE.Color(0x1d4e89), land = new THREE.Color(0x2f9e74), ice = new THREE.Color(0xdfe8ff);
        var v = new THREE.Vector3();
        for (var f = 0; f < p.count; f += 3) {
          v.set(0, 0, 0);
          for (var k = 0; k < 3; k++) v.add(new THREE.Vector3(p.getX(f + k), p.getY(f + k), p.getZ(f + k)));
          v.multiplyScalar(1 / 3).normalize();
          var n = Math.sin(v.x * 5.1 + 1.3) * Math.cos(v.y * 4.3 - 0.7) + Math.sin(v.z * 6.7 + 2.1) * 0.6 + (rng() - 0.5) * 0.25;
          var c = Math.abs(v.y) > 0.86 ? ice : (n > 0.35 ? land : ocean);
          for (k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
        }
        planetGeo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        planetGeo.computeVertexNormals();
        var planet = new THREE.Mesh(planetGeo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.85 }));
        planet.position.set(0, -8.2, -6);
        scene.add(planet);
        var atmo = new THREE.Mesh(new THREE.SphereGeometry(4.35, 48, 48),
          new THREE.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.12, side: THREE.BackSide }));
        atmo.position.copy(planet.position); scene.add(atmo);

        // Satellite (hero): body, two solar arrays, dish, radiator
        var sat = new THREE.Group();
        var body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.2, 1.0),
          new THREE.MeshStandardMaterial({ color: 0xd9a426, metalness: 0.5, roughness: 0.5, flatShading: true }));
        sat.add(body);
        var panelMat = new THREE.MeshStandardMaterial({ color: 0x0f2a5c, metalness: 0.3, roughness: 0.45, emissive: 0x0a2a44, emissiveIntensity: 0.6 });
        var gridMat = new THREE.LineBasicMaterial({ color: 0x4cc9f0 });
        [-1, 1].forEach(function (side) {
          var arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6, 8), new THREE.MeshStandardMaterial({ color: 0xaab4cf, roughness: 0.6 }));
          arm.rotation.z = Math.PI / 2; arm.position.set(side * 0.8, 0, 0); sat.add(arm);
          var panel = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.9, 0.04), panelMat);
          panel.position.set(side * 2.3, 0, 0); sat.add(panel);
          var g = new THREE.BufferGeometry(); var gp = [];
          for (var gx = -1.2; gx <= 1.21; gx += 0.4) gp.push(gx, -0.45, 0.03, gx, 0.45, 0.03);
          gp.push(-1.2, 0, 0.03, 1.2, 0, 0.03);
          g.setAttribute("position", new THREE.Float32BufferAttribute(gp, 3));
          var grid = new THREE.LineSegments(g, gridMat); grid.position.copy(panel.position); sat.add(grid);
        });
        var dish = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.35, 24, 1, true),
          new THREE.MeshStandardMaterial({ color: 0xf2f4fa, roughness: 0.4, side: THREE.DoubleSide }));
        dish.rotation.x = Math.PI; dish.position.set(0, 0.95, 0.15); sat.add(dish);
        var feed = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5, 8), new THREE.MeshStandardMaterial({ color: 0xaab4cf }));
        feed.position.set(0, 1.0, 0.15); sat.add(feed);
        var radiator = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.38, 0.05),
          new THREE.MeshStandardMaterial({ color: 0xf5f7ff, roughness: 0.35, metalness: 0.1 }));
        radiator.position.set(0, -0.32, 0.53); sat.add(radiator); // white plate on the visible face
        scene.add(sat);

        // Callout anchors in satellite-local space
        var anchors = [new THREE.Vector3(2.3, 0.25, 0.05), new THREE.Vector3(-0.2, 1.05, 0.2), new THREE.Vector3(0.2, -0.32, 0.56)];
        var labelPos = [[600, 1180], [130, 700], [130, 1180]]; // label boxes stay inside the 168-1330 px band
        var labels = [0, 1, 2].map(function (i) { return document.getElementById("sat-label-" + i); });
        var lines = [0, 1, 2].map(function (i) { return document.getElementById("sat-line-" + i); });
        var dots = [0, 1, 2].map(function (i) { return document.getElementById("sat-dot-" + i); });
        var sizes = labels.map(function (el) { return [el.offsetWidth, el.offsetHeight]; }); // measured once

        // Animated state (GSAP drives st; render reads it)
        var st = { camZ: 22, camY: 3.5, satRot: -0.9, satTilt: 0.35, c0: 0, c1: 0, c2: 0, planetRot: 0 };
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(st, { camZ: 22, camY: 3.5 }, { camZ: 13, camY: 0.9, duration: 3.2, ease: "power2.inOut" }, 0);
        tl.fromTo(st, { satRot: -0.9 }, { satRot: 0.3, duration: 7, ease: "none" }, 0);
        tl.fromTo(st, { planetRot: 0 }, { planetRot: 0.35, duration: 7, ease: "none" }, 0);
        tl.fromTo(st, { c0: 0 }, { c0: 1, duration: 0.35, ease: "back.out(2)" }, 3.2);
        tl.fromTo(st, { c1: 0 }, { c1: 1, duration: 0.35, ease: "back.out(2)" }, 4.0);
        tl.fromTo(st, { c2: 0 }, { c2: 1, duration: 0.35, ease: "back.out(2)" }, 4.8);
        tl.fromTo("#sat-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
        tl.fromTo("#sat-kicker", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
        tl.fromTo("#sat-badge", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
        tl.fromTo("#sat-source", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
        window.__timelines["main"] = tl;

        var tmp = new THREE.Vector3();
        function renderScene() {
          camera.position.set(0.4, st.camY, st.camZ);
          camera.lookAt(0, -0.2, 0);
          sat.rotation.set(st.satTilt, st.satRot, 0.08);
          planet.rotation.y = st.planetRot;
          sat.updateMatrixWorld(true);
          renderer.render(scene, camera);
          [st.c0, st.c1, st.c2].forEach(function (c, i) {
            tmp.copy(anchors[i]).applyMatrix4(sat.matrixWorld).project(camera);
            var ax = (tmp.x * 0.5 + 0.5) * W, ay = (-tmp.y * 0.5 + 0.5) * H;
            var lx = labelPos[i][0], ly = labelPos[i][1];
            var bw = sizes[i][0], bh = sizes[i][1];
            var ex = ax < lx ? lx : lx + bw, ey = ly + bh / 2;
            lines[i].setAttribute("x1", ax); lines[i].setAttribute("y1", ay);
            lines[i].setAttribute("x2", ax + (ex - ax) * c); lines[i].setAttribute("y2", ay + (ey - ay) * c);
            lines[i].setAttribute("opacity", c > 0 ? 1 : 0);
            dots[i].setAttribute("cx", ax); dots[i].setAttribute("cy", ay); dots[i].setAttribute("opacity", c > 0 ? 1 : 0);
            labels[i].style.opacity = Math.max(0, Math.min(1, c));
            labels[i].style.transform = "translate(" + lx + "px," + ly + "px) scale(" + (0.85 + 0.15 * c) + ")";
          });
        }
        tl.eventCallback("onUpdate", renderScene);
        renderScene();
      })();
    </script>
  </body>
</html>
