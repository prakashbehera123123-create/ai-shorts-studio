<!doctype html>
<!-- AI Shorts Studio "hyperframes" Lottie scene: plays one Lottie JSON in the 1080x670 visual zone.
     Runtime: @lottiefiles/dotlottie-web (MIT), vendored in lib/. Put the animation in assets/ and record its licence
     (self-made, or LottieFiles item with its per-item licence) in the production manifest. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=670" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 670px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 670px; overflow: hidden; background: transparent; }
      #lot-canvas { position: absolute; left: 290px; top: 85px; width: 500px; height: 500px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="670">
      <canvas id="lot-canvas" class="clip" data-start="0" data-duration="3" data-track-index="0" width="500" height="500"></canvas>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      import { DotLottie } from "./lib/dotlottie-web/index.js";
      DotLottie.setWasmUrl(new URL("./lib/dotlottie-web/dotlottie-player.wasm", import.meta.url).href);
      const player = new DotLottie({
        canvas: document.getElementById("lot-canvas"),
        src: new URL("./assets/check.json", import.meta.url).href,
        autoplay: false,
        loop: false,
        renderConfig: { autoResize: false, freezeOnOffscreen: false },
      });
      window.__hfLottie = window.__hfLottie || [];
      window.__hfLottie.push(player);
    </script>
  </body>
</html>
