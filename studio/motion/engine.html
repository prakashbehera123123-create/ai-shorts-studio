<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI Shorts Studio motion engine</title>
<style>
  :root {
    --base-top: #0B1020; --base-bottom: #121A33; --text: #FFFFFF; --muted: #AAB4CF;
    --cyan: #4CC9F0; --amber: #FFB703; --mint: #3DDC97; --coral: #FF5D73; --panel: #172347; --line: #2A3A6B;
  }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
           background: linear-gradient(180deg, var(--base-top), var(--base-bottom));
           font-family: "Segoe UI", "Segoe UI Variable", Arial, sans-serif; color: var(--text); }
  .scene { position: absolute; inset: 0; transform-origin: 540px 885px; will-change: transform, opacity; }
  .abs { position: absolute; }
  .q { left: 90px; right: 130px; top: 196px; font-size: 34px; font-weight: 600; color: var(--muted); line-height: 1.25; }
  .h { left: 90px; right: 130px; top: 290px; font-size: 80px; font-weight: 800; line-height: 1.08; letter-spacing: -0.5px; }
  .h .acc { color: var(--cyan); }
  .src { left: 90px; top: 1500px; font-size: 30px; color: var(--muted); }
  .chip { display: inline-block; padding: 8px 18px; border-radius: 999px; font-size: 30px; font-weight: 700; }
  .illus { right: 130px; top: 488px; background: rgba(255,183,3,0.16); color: var(--amber); border: 2px solid var(--amber); }
  .icon { display: inline-flex; flex: none; margin-right: 18px; color: var(--cyan); }
  .icon svg { position: static; stroke-width: 2.2; }
  .node { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center;
          border-radius: 26px; border: 3px solid var(--line); background: var(--panel); font-size: 42px; font-weight: 700;
          padding: 0 24px; box-sizing: border-box; font-size: 46px; }
  .tone-active  { border-color: var(--cyan);  box-shadow: 0 0 36px rgba(76,201,240,0.45); }
  .tone-input   { border-color: var(--amber); }
  .tone-success { border-color: var(--mint);  color: var(--mint); }
  .tone-failure { border-color: var(--coral); color: var(--coral); }
  .tone-muted   { opacity: 0.45; }
  .big { left: 90px; right: 130px; text-align: center; font-weight: 900; line-height: 1.05; }
  .row { position: absolute; left: 100px; width: 850px; height: 120px; display: flex; align-items: center; gap: 30px;
         font-size: 52px; font-weight: 800; }
  .box { width: 76px; height: 76px; border-radius: 14px; border: 4px solid var(--muted); display: flex; align-items: center;
         justify-content: center; font-size: 48px; font-weight: 900; color: var(--base-top); flex: none; }
  .tag { white-space: nowrap; font-size: 32px; padding: 6px 14px; border-radius: 999px; border: 2px solid currentColor; font-weight: 700; margin-left: auto; }
  .panel { position: absolute; border-radius: 28px; background: var(--panel); border: 3px solid var(--line); box-sizing: border-box; }
  .ptitle { font-size: 36px; font-weight: 800; padding: 26px 30px 10px; }
  .field { margin: 14px 30px; padding: 18px 22px; border-radius: 16px; border: 3px solid var(--line); font-size: 36px;
           display: flex; gap: 18px; }
  .field .v { min-width: 0; overflow-wrap: anywhere; }
  .field .k { color: var(--muted); font-family: Consolas, "Cascadia Mono", monospace; }
  #topbar { position: absolute; left: 90px; right: 130px; top: 104px; height: 10px; border-radius: 6px; background: rgba(170,180,207,0.25); }
  #progress { height: 10px; border-radius: 6px; background: var(--cyan); width: 0; }
  #step { position: absolute; left: 90px; top: 130px; font-size: 30px; font-weight: 800; color: var(--cyan);
          font-family: Consolas, "Cascadia Mono", monospace; }
  #cap { position: absolute; left: 90px; right: 130px; top: 1262px; height: 210px; display: flex; align-items: center; justify-content: center; }
  #capbox { background: rgba(0,0,0,0.70); border-radius: 30px; padding: 18px 34px; font-size: 68px; font-weight: 800;
            text-align: center; line-height: 1.15; max-width: 820px; }
  #capbox .w { color: #FFFFFF; } #capbox .w.on { color: var(--cyan); }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="topbar"><div id="progress"></div></div>
  <div id="step"></div>
  <div id="cap"><div id="capbox"></div></div>
</div>
<script>
"use strict";
// Deterministic motion engine: every pixel is a pure function of (spec, t). No timers, no CSS transitions.
const VZ = { top: 560, bottom: 1230, left: 90, right: 950 };  // visual zone (docs/CREATIVE_PRODUCTION_STANDARD.md §4.3)
const TRANSITION = 0.32;
const PUSH_IN = 0.03;
const SVGNS = "http://www.w3.org/2000/svg";
let SPEC = null, SCENES = [];

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const prog = (t, t0, d) => clamp((t - t0) / Math.max(d, 1e-6));

const nobreak = s => String(s).replace(/(\w)-(\w)/g, "$1‑$2");  // non-breaking hyphen keeps "GPT-6.2" on one line
function el(tag, cls, parent, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = nobreak(text);
  if (parent) parent.appendChild(e);
  return e;
}
// Lucide icon (inline SVG resolved by studio/motion_spec.py); placed before the element's text
function addIcon(e, svg, size, color) {
  if (!svg) return null;
  const s = document.createElement("span");
  s.className = "icon"; s.innerHTML = svg;
  const g = s.querySelector("svg"); g.setAttribute("width", size); g.setAttribute("height", size);
  if (color) s.style.color = color;
  e.insertBefore(s, e.firstChild);
  return s;
}
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function headline(parent, text, accent) {
  const h = el("div", "abs h", parent);
  for (const [i, w] of text.split(" ").entries()) {
    const s = el("span", accent && w.toLowerCase().replace(/[^a-z0-9.%-]/g, "") === accent.toLowerCase() ? "acc" : "", h, (i ? " " : "") + w);
  }
  return h;
}

// ---- animation primitives: each returns a function(tLocal) that styles its element ----
const A = {
  fadeUp: (e, t0, d = 0.35, dy = 26) => t => { const p = easeOut(prog(t, t0, d)); e.style.opacity = p; e.style.transform = `translateY(${(1 - p) * dy}px)`; },
  pop: (e, t0, d = 0.3) => t => { const p = easeOut(prog(t, t0, d)); e.style.opacity = p; e.style.transform = `scale(${0.85 + 0.15 * p})`; },
  draw: (path, len, t0, d = 0.5) => t => { const p = easeInOut(prog(t, t0, d)); path.setAttribute("stroke-dashoffset", String(len * (1 - p))); },
  travel: (dot, path, len, t0, d = 0.6) => t => {
    const p = prog(t, t0, d);
    if (p <= 0 || p >= 1) { dot.setAttribute("opacity", p >= 1 ? "0" : "0"); return; }
    const pt = path.getPointAtLength(len * easeInOut(p));
    dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y); dot.setAttribute("opacity", "1");
  },
  cls: (e, name, t0) => t => e.classList.toggle(name, t >= t0),
  width: (e, t0, d, to) => t => { e.style.width = `${to * easeOut(prog(t, t0, d))}px`; },
  count: (e, t0, d, to, fmt) => t => { e.textContent = fmt(to * easeOut(prog(t, t0, d))); },
};

function cueTime(scene, i, n) {
  // cue times (seconds from scene start) come from word timings; fallback spreads items over the spoken part
  const c = (scene.cues || [])[i];
  if (typeof c === "number") return c;
  const span = Math.max(scene.speech || (scene.end - scene.start), 0.5);
  return 0.15 + (span * 0.8) * (n <= 1 ? 0 : i / (n - 1));
}

function tracePath(svg, d, color = "var(--cyan)", width = 6) {
  const p = svgEl("path", { d, fill: "none", stroke: color, "stroke-width": width, "stroke-linecap": "round" }, svg);
  const len = p.getTotalLength();
  p.setAttribute("stroke-dasharray", `${len} ${len}`); p.setAttribute("stroke-dashoffset", String(len));
  return [p, len];
}
function dot(svg, color = "var(--cyan)") {
  return svgEl("circle", { r: 14, fill: color, opacity: 0, style: "filter: drop-shadow(0 0 12px rgba(76,201,240,0.9))" }, svg);
}

// ---- templates: build DOM for the visual zone, push animation functions into `anims` ----
const T = {
  kinetic(root, v, sc, anims) {
    const lines = v.lines || [sc.headline];
    const size = v.size || 108;
    const total = lines.length;
    lines.forEach((ln, i) => {
      const e = el("div", "abs big", root);
      const shift = v.icon_svg ? 190 : 0;  // make room for the hero icon
      e.style.top = `${VZ.top + 140 + shift + i * size * 1.12 - (total - 1) * size * 0.3}px`; e.style.fontSize = `${size}px`;
      ln.split(" ").forEach((w, j) => {
        const s = el("span", "", e, (j ? " " : "") + w);
        if (v.accent && w.toLowerCase().includes(v.accent.toLowerCase())) s.style.color = "var(--cyan)";
      });
      e.style.opacity = 0; anims.push(A.pop(e, cueTime(sc, i, total)));
    });
    if (v.icon_svg) {  // hero icon above the words
      const hi = el("div", "abs", root); Object.assign(hi.style, { left: "430px", top: `${VZ.top - 10}px`, opacity: 0 });
      addIcon(hi, v.icon_svg, 220, "var(--cyan)").style.margin = "0";
      anims.push(A.pop(hi, cueTime(sc, 0, total + 1)));
    }
    if (v.trace !== false) {
      const svg = svgEl("svg", { width: 1080, height: 1920 }, root);
      const y = VZ.bottom - 120;
      const [p, len] = tracePath(svg, `M 110 ${y} C 330 ${y - 90}, 560 ${y + 90}, 950 ${y - 20}`);
      const d = dot(svg);
      anims.push(A.draw(p, len, 0.1, Math.min(1.4, (sc.end - sc.start) * 0.6)));
      anims.push(A.travel(d, p, len, 0.1, Math.min(1.4, (sc.end - sc.start) * 0.6)));
    }
  },

  fork(root, v, sc, anims) {
    const svg = svgEl("svg", { width: 1080, height: 1920 }, root);
    const src = el("div", "node tone-input", root, v.from);
    Object.assign(src.style, { left: "300px", top: `${VZ.top + 30}px`, width: "480px", height: "140px", opacity: 0 });
    anims.push(A.pop(src, cueTime(sc, 0, 3)));
    // branch nodes stay inside the safe area: x 90..950 (right 130 px kept clear for Shorts buttons)
    const ends = [[290, VZ.bottom - 120], [750, VZ.bottom - 120]];
    v.branches.forEach((b, i) => {
      const [x, y] = ends[i];
      const [p, len] = tracePath(svg, `M 540 ${VZ.top + 170} C 540 ${VZ.top + 360}, ${x} ${VZ.top + 300}, ${x} ${y - 80}`,
        b.tone === "failure" ? "var(--coral)" : "var(--mint)", 8);
      const d = dot(svg, b.tone === "failure" ? "var(--coral)" : "var(--mint)");
      const t0 = cueTime(sc, i + 1, 3);
      anims.push(A.draw(p, len, t0, 0.55)); anims.push(A.travel(d, p, len, t0, 0.55));
      const n = el("div", `node tone-${b.tone}`, root, b.label); addIcon(n, b.icon_svg, 56);
      Object.assign(n.style, { left: `${x - 195}px`, top: `${y - 80}px`, width: "390px", height: "150px", opacity: 0 });
      anims.push(A.pop(n, t0 + 0.5));
    });
  },

  flow(root, v, sc, anims) {
    const nodes = v.nodes; const n = nodes.length;
    const svg = svgEl("svg", { width: 1080, height: 1920 }, root);
    const h = 118, gap = Math.min(70, (VZ.bottom - VZ.top - n * h) / Math.max(n - 1, 1));
    const pos = nodes.map((_, i) => ({ x: i % 2 === 0 ? 140 : 360, y: VZ.top + 10 + i * (h + gap) }));
    nodes.forEach((nd, i) => {
      const e = el("div", `node tone-${nd.tone || "default"}`, root, nd.label); addIcon(e, nd.icon_svg, 60);
      Object.assign(e.style, { left: `${pos[i].x}px`, top: `${pos[i].y}px`, width: "560px", height: `${h}px`, opacity: 0 });
      const t0 = cueTime(sc, i, n);
      anims.push(A.pop(e, t0));
      if (i > 0) {
        const a = pos[i - 1], b = pos[i];
        const x1 = a.x + 280, y1 = a.y + h, x2 = b.x + 280, y2 = b.y;
        const [p, len] = tracePath(svg, `M ${x1} ${y1} C ${x1} ${y1 + gap * 0.8}, ${x2} ${y2 - gap * 0.8}, ${x2} ${y2}`,
          nd.tone === "muted" ? "var(--line)" : "var(--cyan)");
        const d = dot(svg);
        anims.push(A.draw(p, len, t0 - 0.35, 0.35)); anims.push(A.travel(d, p, len, t0 - 0.35, 0.45));
      }
      if (nd.tone === "active") { e.classList.remove("tone-active"); anims.push(A.cls(e, "tone-active", t0 + 0.2)); }
    });
    if (v.side) {
      const s = el("div", `node tone-${v.side.tone || "muted"}`, root, v.side.label);
      Object.assign(s.style, { left: "700px", top: `${pos[Math.min(v.side.at || 1, n - 1)].y}px`, width: "250px", height: `${h}px`, fontSize: "32px", opacity: 0 });
      anims.push(A.pop(s, cueTime(sc, v.side.at || 1, n)));
    }
  },

  split(root, v, sc, anims) {
    const sides = [v.left, v.right];
    const items = sides.reduce((k, s) => k + 1 + (s.items || []).length, 0);
    let k = 0;
    sides.forEach((s, i) => {
      const pnl = el("div", `panel tone-${s.tone || "default"}`, root);
      Object.assign(pnl.style, { left: `${90 + i * 440}px`, top: `${VZ.top + 70}px`, width: "420px", minHeight: "420px", paddingBottom: "24px", opacity: 0 });
      const ttl = el("div", "ptitle", pnl, s.title); ttl.style.fontSize = "48px"; ttl.style.paddingTop = "34px";
      if (s.icon_svg) { ttl.style.display = "flex"; ttl.style.alignItems = "center"; addIcon(ttl, s.icon_svg, 56); }
      if (s.tone === "failure") ttl.style.color = "var(--coral)";
      if (s.tone === "success") ttl.style.color = "var(--mint)";
      if (s.tone === "active") ttl.style.color = "var(--cyan)";
      anims.push(A.pop(pnl, cueTime(sc, k++, items)));
      (s.items || []).forEach(it => {
        const f = el("div", "field", pnl, it); f.style.fontSize = "42px"; f.style.fontWeight = "700"; f.style.padding = "26px 24px"; f.style.opacity = 0;
        anims.push(A.fadeUp(f, cueTime(sc, k++, items)));
      });
    });
  },

  checklist(root, v, sc, anims) {
    const n = v.items.length; const tick = v.checked || [];
    v.items.forEach((it, i) => {
      const r = el("div", "row", root); r.style.top = `${VZ.top + 40 + i * 190}px`; r.style.opacity = 0;
      const b = el("div", "box", r); const lab = el("div", "", r, it);
      if ((v.icons_svg || [])[i]) { lab.style.display = "flex"; lab.style.alignItems = "center"; addIcon(lab, v.icons_svg[i], 64); }
      anims.push(A.fadeUp(r, cueTime(sc, i, n + (tick.length ? 1 : 0))));
      if (tick.includes(i)) {
        const tt = cueTime(sc, i, n + 1) + 0.45;  // tick as each row is spoken, not all at the end
        anims.push(t => { const on = t >= tt; b.style.background = on ? "var(--mint)" : "transparent"; b.style.borderColor = on ? "var(--mint)" : "var(--muted)"; b.textContent = on ? "✓" : ""; });
      }
      const tag = (v.tags || [])[i];
      if (tag) {
        const tg = el("span", "tag", r, tag.text); tg.style.color = `var(--${tag.color || "cyan"})`; tg.style.opacity = 0;
        anims.push(A.pop(tg, cueTime(sc, n, n + 1) + i * 0.3));
      }
    });
  },

  stack(root, v, sc, anims) {
    const n = v.rows.length;
    v.rows.forEach((txt, i) => {
      const r = el("div", "node", root, txt); addIcon(r, (v.icons_svg || [])[i], 52);
      Object.assign(r.style, { left: "110px", top: `${VZ.top + 30 + i * 128}px`, width: "500px", height: "104px", fontSize: "36px", justifyContent: "flex-start", opacity: 0 });
      anims.push(A.fadeUp(r, cueTime(sc, Math.min(i, 1), 3) + i * 0.18));
      if (i === v.mark) {
        const tm = cueTime(sc, 1, 3) + 0.5;
        anims.push(t => { r.style.borderColor = t >= tm ? "var(--amber)" : "var(--line)"; r.style.borderStyle = t >= tm ? "dashed" : "solid"; });
      }
    });
    if (v.tag) {
      const tg = el("div", "abs chip", root, v.tag);
      Object.assign(tg.style, { left: "630px", whiteSpace: "nowrap", top: `${VZ.top + 30 + (v.mark || 0) * 128 + 20}px`, color: "var(--cyan)", border: "3px solid var(--cyan)", background: "rgba(76,201,240,0.12)", opacity: 0 });
      anims.push(A.pop(tg, cueTime(sc, 2, 3)));
    }
  },

  panel(root, v, sc, anims) {
    const p = el("div", "panel", root);
    Object.assign(p.style, { left: "110px", top: `${VZ.top + 30}px`, width: "820px", opacity: 0 });
    el("div", "ptitle", p, v.title || "Request");
    anims.push(A.pop(p, cueTime(sc, 0, 2)));
    v.fields.forEach(([k, val], i) => {
      const f = el("div", "field", p); el("span", "k", f, k);
      // long values (e.g. namespaced spec keys) go on their own line and may break after "/" or "."
      const long = (k.length + String(val).length) > 26;
      el("span", "v", f, long ? String(val).replace(/([\/.])/g, "$1​") : val);
      if (long) { f.style.flexDirection = "column"; f.style.gap = "4px"; }
      if (i === v.highlight) {
        const th = cueTime(sc, 1, 2);
        anims.push(t => { const on = t >= th; f.style.borderColor = on ? "var(--cyan)" : "var(--line)"; f.style.boxShadow = on ? `0 0 ${20 + 14 * Math.sin((t - th) * 6)}px rgba(76,201,240,0.5)` : "none"; });
      }
    });
  },

  chart(root, v, sc, anims) {
    const n = v.bars.length; const max = Math.max(...v.bars.map(b => b.value));
    v.bars.forEach((b, i) => {
      const y = VZ.top + 70 + i * 170;
      const lab = el("div", "abs", root, b.label); Object.assign(lab.style, { left: "110px", top: `${y}px`, fontSize: "38px", fontWeight: 700 });
      const bar = el("div", "abs", root); Object.assign(bar.style, { left: "110px", top: `${y + 56}px`, height: "64px", borderRadius: "14px", background: `var(--${b.color || "cyan"})` });
      const val = el("div", "abs", root); Object.assign(val.style, { left: "800px", top: `${y + 56}px`, fontSize: "48px", fontWeight: 900 });
      const t0 = cueTime(sc, i, n);
      anims.push(A.width(bar, t0, 0.6, 660 * b.value / max));
      anims.push(A.count(val, t0, 0.6, b.value, x => `${Math.round(x)}${v.unit || ""}`));
    });
  },

  hyperframes(root, v, sc, anims) {
    // Visual zone left empty: compose overlays the HyperFrames block clip here (studio/scene3d.py).
  },

  scene3d(root, v, sc, anims) {
    // The visual zone stays empty here: compose overlays the HyperFrames 3D clip (studio/scene3d.py) on this band.
  },

  title(root, v, sc, anims) {
    const e = el("div", "abs big", root, v.text || sc.headline);
    Object.assign(e.style, { top: `${VZ.top + 160}px`, fontSize: `${v.size || 110}px`, opacity: 0 });
    anims.push(A.pop(e, cueTime(sc, 0, 2)));
    if (v.sub) { const s = el("div", "abs big", root, v.sub); Object.assign(s.style, { top: `${VZ.top + 420}px`, fontSize: "46px", color: "var(--muted)", fontWeight: 700, opacity: 0 }); anims.push(A.fadeUp(s, cueTime(sc, 1, 2))); }
    const svg = svgEl("svg", { width: 1080, height: 1920 }, root);
    const [p, len] = tracePath(svg, `M 110 ${VZ.bottom - 60} L 950 ${VZ.bottom - 60}`);
    const d = dot(svg);
    anims.push(A.draw(p, len, 0.2, 1.2)); anims.push(A.travel(d, p, len, 0.2, 1.2));
  },
};

function buildScene(sc, idx) {
  const root = el("div", "scene", document.getElementById("scenes"));
  root.style.opacity = 0;
  const anims = [];
  const v = sc.visual || { template: "kinetic" };
  const bigText = v.template === "kinetic" || v.template === "title";
  if (sc.question && !bigText) { const q = el("div", "abs q", root, sc.question); }
  if (!bigText) { const h = headline(root, sc.headline, sc.accent); h.style.opacity = 0; anims.push(A.fadeUp(h, 0.05)); }
  if (v.illustrative) { const c = el("div", "abs chip illus", root, "ILLUSTRATIVE"); c.style.opacity = 0; anims.push(A.pop(c, 0.2)); }
  (T[v.template] || T.kinetic)(root, v, sc, anims);
  if (sc.source) { const s = el("div", "abs src", root, sc.source); s.style.opacity = 0; anims.push(A.fadeUp(s, 0.4)); }
  return { sc, root, anims, idx };
}

function styleScene(S, tLocal, opacity, extra) {
  for (const f of S.anims) f(tLocal);
  const dur = S.sc.end - S.sc.start;
  const s = 1 + PUSH_IN * clamp(tLocal / Math.max(dur, 0.1));
  S.root.style.opacity = opacity;
  S.root.style.transform = `${extra || ""} scale(${s})`;
}

function renderCaption(t) {
  const box = document.getElementById("capbox");
  const c = SPEC.captions.find(c => t >= c.start && t < c.end);
  if (!c) { box.style.opacity = 0; return; }
  box.style.opacity = 1;
  const key = `${c.start}`;
  if (box.dataset.key !== key) {
    box.dataset.key = key; box.innerHTML = "";
    c.words.forEach((w, i) => el("span", "w", box, (i ? " " : "") + w.text));
  }
  [...box.children].forEach((s, i) => s.classList.toggle("on", t >= c.words[i].start && t < c.words[i].end + 0.05));
}

window.loadSpec = function (spec) {
  SPEC = spec;
  document.getElementById("scenes").innerHTML = "";
  SCENES = spec.scenes.map(buildScene);
  return SCENES.length;
};

window.renderAt = function (t) {
  const i = Math.max(0, SCENES.findIndex(S => t >= S.sc.start && t < S.sc.end) === -1 ? SCENES.length - 1
                        : SCENES.findIndex(S => t >= S.sc.start && t < S.sc.end));
  SCENES.forEach(S => { S.root.style.opacity = 0; });
  const cur = SCENES[i];
  const tl = t - cur.sc.start;
  const kind = cur.sc.transition_in || "cut";
  if (i > 0 && tl < TRANSITION && kind !== "cut" && kind !== "match_cut") {
    const prev = SCENES[i - 1];
    const p = easeInOut(tl / TRANSITION);
    const tp = prev.sc.end - prev.sc.start;
    if (kind === "push") { styleScene(prev, tp, 1, `translateX(${-1080 * p}px)`); styleScene(cur, tl, 1, `translateX(${1080 * (1 - p)}px)`); }
    else if (kind === "zoom_through") { styleScene(prev, tp, 1 - p, `scale(${1 + 0.25 * p})`); styleScene(cur, tl, p, `scale(${0.92 + 0.08 * p})`); }
    else { styleScene(prev, tp, 1 - p); styleScene(cur, tl, p); }
  } else {
    styleScene(cur, tl, 1);
  }
  document.getElementById("progress").style.width = `${830 * clamp(t / SPEC.duration)}px`;
  document.getElementById("step").textContent = cur.sc.step || "";
  renderCaption(t);
  return i;
};
</script>
</body>
